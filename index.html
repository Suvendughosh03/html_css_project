<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="navbar">
            <div class="nav-logo border">
                <div class="logo"></div>
            </div> 
            
            <div class="nav-adress border">
                <p class="add-first">Delivar to</p>
                <div class="add-icon">
                    <i class="fa-solid fa-location-dot"></i>
                    <p class="add-second">India</p>
                </div>
            </div>

            <div class="nav-search">
                <select class="search-select">
                    <option>All</option>
                </select>
                <input placeholder="Search Amazon" class="search-input">
                <div class="search-icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>

            <div class="language">
                <input type="checkbox" id="language-btn">
                <label for="language-btn">
                    EN <span><i class="fa-solid fa-caret-down"></i></span>
                </label>
                <div class="language-menu">
                    <p>English - EN</p>
                    <p>हिन्दी - HI - अनुवाद</p>
                    <p>বাংলা - BN - অনুবাদ</p>
                    <p>मराठी - MR - भाषांतर</p>
                    <p>ಕನ್ನಡ - KN - ಭಾಷಾಂತರ</p>
                    <p>தமிழ் - TA - மொழிபெயர்ப்பு</p>
                    <p>తెలుగు - TE - అనువాదం</p>
                </div>
            </div>

        </div>

    </header>   
</body>
</html>
